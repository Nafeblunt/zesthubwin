<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat | Zest Hub</title>
  <link rel="icon" href="/ZestIco.png" type="image/png">
  <link rel="stylesheet" href="/style.css">
  <script src="/shell.js" defer></script>
  <script src="/time-ago.js" defer></script>
  <script src="/chat.js" defer></script>
  <script src="/script.js" defer></script>
</head>
<body class="chat-page">
  <div id="site-header" data-page="Chat"></div>
  <main class="community-main chat-main">
    <section class="chat chat-full" id="chat" data-room="community" aria-labelledby="chat-title">
      <header class="chat-header"><h1 id="chat-title">Chat</h1></header>
      <div class="chat-messages" id="chat-messages" role="log" aria-live="polite" aria-relevant="additions" tabindex="0" aria-label="Community messages"><p class="chat-empty">Loading messages</p></div>
      <form class="chat-form" id="chat-form" hidden>
        <label class="visually-hidden" for="chat-input">Your message</label>
        <input type="text" id="chat-input" placeholder="Say something" maxlength="280" autocomplete="off" required disabled aria-describedby="chat-status">
        <span class="chat-count" id="chat-count">0/280</span>
        <button class="chat-send" type="submit" disabled>Send <span aria-hidden="true">↗</span></button>
      </form>
      <p class="chat-status" id="chat-status" role="status">Log in to chat</p>
    </section>
</main>
</body>
</html>
