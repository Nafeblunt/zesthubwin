<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market | Zest Hub</title>
  <link rel="icon" href="/ZestIco.png" type="image/png">
  <link rel="stylesheet" href="/style.css">
  <script src="/shell.js" defer></script>
  <script src="/time-ago.js" defer></script>
  <script src="/community.js" defer></script>
  <script src="/script.js" defer></script>
</head>
<body data-community="market">
  <div id="site-header" data-page="Market"></div>
  <main class="community-main">
    <header class="community-header"><h1>Market</h1></header>
    <p class="community-note">Market is coming soon</p>
    <section class="community-compose" aria-labelledby="compose-title" hidden id="compose">
      <h2 id="compose-title">New listing</h2>
      <form id="post-form"><label for="post-title">Title</label><input id="post-title" maxlength="100" required><label for="post-body">Description</label><textarea id="post-body" maxlength="4000" rows="5" required></textarea><button class="community-submit" type="submit">Publish</button></form>
    </section>
    <p id="community-status" role="status"></p><section aria-label="Market listings" id="posts" class="community-posts"></section>
  </main>
</body>
</html>
