<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zest Hub</title>
  <link rel="icon" href="/ZestIco.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <script src="shell.js" defer></script>
  <script src="time-ago.js" defer></script>
  <script src="chat.js" defer></script>
  <script src="checkout.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>

  <div id="site-header" data-page="Home"></div>

  <main class="hero" id="hero">
    <h1>Zest Hub</h1>
    <button id="download-btn" type="button" hidden>Download</button>
    <button id="buy-btn" type="button">Buy</button>
    <a class="button-link" href="https://discord.gg/j8rxvnFeGJ">Discord</a>
  </main>

  <section class="chat" id="chat" aria-labelledby="chat-title">
    <header class="chat-header"><div><h2 id="chat-title">Shoutbox</h2></div></header>
    <div class="chat-messages" id="chat-messages" role="log" aria-live="polite" aria-relevant="additions" tabindex="0" aria-label="Community messages"><p class="chat-empty">Loading messages</p></div>
    <form class="chat-form" id="chat-form" hidden>
      <label class="visually-hidden" for="chat-input">Your message</label>
      <input type="text" id="chat-input" placeholder="Sign in with Discord to chat" maxlength="280" autocomplete="off" required disabled aria-describedby="chat-status">
      <span class="chat-count" id="chat-count">0/280</span>
      <button class="chat-send" type="submit" disabled>Send <span aria-hidden="true">↗</span></button>
    </form>
    <p class="chat-status" id="chat-status" role="status"></p>
  </section>

  <dialog id="buy-dialog" class="account-dialog buy-dialog" aria-labelledby="buy-title">
    <div class="account-heading"><h2 id="buy-title">Buy Zest Hub</h2><button id="buy-close" type="button" aria-label="Close checkout">&times;</button></div>
    <div class="buy-body">
      <div class="buy-summary">
        <p class="account-kicker">LIFETIME LICENCE</p>
        <p class="buy-price">$15 <span>USD, one time</span></p>
        <ul class="buy-list">
          <li>Key delivered to your Discord account on this site</li>
          <li>Buyer role and loader download unlocked</li>
          <li>No renewals</li>
        </ul>
      </div>
      <div class="buy-checkout">
        <p class="account-kicker">PAYMENT</p>
        <button id="buy-login" class="chat-send" type="button" hidden>Log in with Discord</button>
        <div id="paypal-button" hidden></div>
        <button id="buy-retry" class="chat-send" type="button" hidden>Retry delivery</button>
        <p id="buy-status" class="buy-status" role="status">Loading checkout</p>
      </div>
    </div>
  </dialog>
</body>
</html>
